name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Static checks
        run: make lint
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Console types, lint and API contract
        run: make ui-check
      - name: Tests, race detector, coverage thresholds
        run: make cover
      - name: Known vulnerabilities
        run: make vuln
      - name: Committed secrets
        run: make secrets-scan
      - name: Short fuzz pass
        run: make fuzz FUZZTIME=15s
